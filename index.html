<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="index.css"/>
    <title> História da Cidade</title>
</head>
<body>
    <!-- Linha do Tempo -->
    <section id="timeline" class="timeline-seçao"> 
        <h2>Marcos Históricos</h2>

        <div class="timeline-linha">

            <div class="timeline-ponto">
                <span class="ano"> 1693 </span>
                <span class="descricao"> FUNDAÇÃO </span>
                <span> 
                    <img src="img/1693.jpg" class="img">
                </span>
            </div>

            <div class="timeline-ponto">
                <span class="ano"> 1808 </span>
                <span class="descricao"> CORTE REAL </span>
                <span> 
                    <img src="img/1808.jpg" class="img">
                </span>
            </div>

            <div class="timeline-ponto">
                <span class="ano"> 1889 </span>
                <span class="descricao"> REPÚBLICA </span>
                <span> 
                    <img src="img/1889.jpg" class="img">
                </span>
            </div>

            <div class="timeline-ponto">
                <span class="ano"> 1930 </span>
                <span class="descricao"> INDUSTRIALIZAÇÃO </span>
                <span> 
                    <img src="img/1930.jpg" class="img">
                </span>
            </div>
            
            <div class="timeline-ponto">
                <span class="ano"> 2000S </span>
                <span class="descricao"> METRÓPOLE </span>
                <span> 
                    <img src="img/2000s.jpg" class="img">
                </span>
            </div>

        </div>
    </section>

</body>
